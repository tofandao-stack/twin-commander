name: Linux build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev libarchive-dev curl python3 openssl
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check installation
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/twin-commander"
          "$RUNNER_TEMP/twin-commander/bin/twin-commander" --help
          "$RUNNER_TEMP/twin-commander/bin/twin-commander" --version
